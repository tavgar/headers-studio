<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Headers Studio</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon48.png" width="38" height="38" alt="">
        <div>
          <h1>Headers Studio</h1>
          <p>Header visibility without the scavenger hunt.</p>
        </div>
      </header>

      <section class="status-card">
        <div>
          <span id="captureCount">—</span>
          <small>captured for this tab</small>
        </div>
        <div>
          <span id="ruleCount">—</span>
          <small>active overrides</small>
        </div>
      </section>

      <section class="instructions">
        <span class="step">1</span>
        <div>
          <strong>Open Chrome DevTools</strong>
          <p>Press F12, then choose the <b>Headers Studio</b> panel.</p>
        </div>
      </section>

      <div class="assurance">
        Cookie and Set-Cookie are captured locally. Nothing is uploaded.
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
